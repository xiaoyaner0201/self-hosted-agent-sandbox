name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  local-gates:
    name: source-and-wheel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Prepare disposable transport fixture
        run: docker pull node:22-bookworm
      - name: Source gates (no cluster)
        env:
          PYTHONPATH: src
          KUBECONFIG: /dev/null
          SHAS_TEST_IMAGE: node:22-bookworm
        run: |
          python tests/route_table.py
          python tests/route_fuzz.py
          python tests/core_unit.py
          python tests/lifecycle_unit.py
          python tests/artifact_pull.py
          python tests/artifact_integrity.py
          python tests/integration_cross.py
      - name: Build and install wheel
        run: |
          python -m pip install build==1.3.0
          python -m build
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/pip" install --no-deps dist/*.whl
      - name: Installed-wheel gates (not editable source)
        env:
          KUBECONFIG: /dev/null
          SHAS_TEST_IMAGE: node:22-bookworm
        run: |
          python tests/check_installed_wheel.py "$RUNNER_TEMP/wheel-venv/bin/python"
